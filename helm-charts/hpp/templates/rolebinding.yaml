apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-rolebinding"
  namespace: model-serving
  labels:
    app: "{{ .Release.Name }}"
subjects:
- kind: ServiceAccount
  name: "{{ .Release.Name }}-sa"
  namespace: model-serving
roleRef:
  kind: Role
  name: "{{ .Release.Name }}-role"
  apiGroup: rbac.authorization.k8s.io
